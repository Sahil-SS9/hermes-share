[project]
name = "hermes-share"
version = "0.2.1"
description = "Share redacted, revocable session bundles as secret GitHub gists, and import them back"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Sahil-SS9" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
