name: hermes-share
version: 0.2.1
description: "Share one or several sessions as a redacted, revocable secret GitHub gist from /share, import a shared bundle back with /share import, and delete it again with /unshare. Disclosure — reads the sessions you name through the public `hermes sessions export` CLI, writes the redacted bundle and a bounded ledger under the Hermes plugin-data directory, downloads an import target with gh or over https only (redirects included), and runs `hermes sessions import` only after /share import confirm; the only network writes are `gh gist create` and `gh gist delete`, both only after you confirm, never with --public, and it holds no token of its own. Redaction cannot be switched off. On a chat platform only the calling conversation is shared and only its own gists can be listed or deleted, unless the owner sets allow_gateway_selectors."
manifest_version: 2
author: "Sahil-SS9"
license: MIT
homepage: https://github.com/Sahil-SS9/hermes-share
provides_tools: []
provides_hooks: []
requires_env: []
python_dependencies: []
config_schema:
  allow_gateway_import:
    type: bool
    default: false
    description: >-
      Allow /share import from a chat platform (Discord, Telegram, Slack, ...). An import writes
      sessions into this Hermes's own store, so it stays off until the owner turns it on. Sharing
      and /unshare work on chat platforms either way.
