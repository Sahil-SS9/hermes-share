name: hermes-share
repo: https://github.com/Sahil-SS9/hermes-share
sha: "REPLACE_WITH_THE_FULL_40_HEX_RELEASE_COMMIT_SHA"
subdir: ""
title: "Session Share"
version: "0.1.0"
description: "Share the current session as a redacted, revocable secret GitHub gist with /share, and delete it again with /unshare. Previews the exact document first — file path, size, redaction count and the first twenty lines — and uploads nothing until /share confirm. Credentials become non-reusable sentinels (never a head/tail mask), home paths become ~, and your account and host names are replaced; redaction cannot be switched off. Writes the export, a 50-row share ledger and a capped preview directory under plugin-data; a pending preview expires after 15 minutes. Disclosure — reads the current session read-only through the same export functions /save uses (hermes_cli.session_export.load_save_snapshot / render_session_for_save, plus agent.redact, which the validator reports as private core imports because no public plugin seam exports a session); makes exactly two network calls, gh gist create and gh gist delete, only after /share confirm, never passing --public, and takes no token of its own because authentication is whatever the gh CLI already holds; refuses on messaging platforms and points at /save instead; runs no other subprocess, and gives gh an allowlisted environment rather than the session's, which holds every provider key on the machine."
maintainer: Sahil-SS9
tier: community
category: productivity
requires_hermes: ">=0.21.5"
docs_url: https://github.com/Sahil-SS9/hermes-share#readme
readme: true
platforms: [linux, macos, windows]
known_issues:
  - "The security scan reports a `context_exfil` caution against the plugin's own README (two lines that describe sharing a conversation). It is a documentation match on the word 'share' next to 'conversation', not an instruction to an agent and not code; the shipped modules contain no such string and the scan is `safe` for them. Not reworded, because renaming a feature to silence a scanner is how a real finding later hides."
  - "Messaging platforms (Telegram, Discord, Slack, WhatsApp, Matrix) are refused with a message pointing at /save. The preview has to be read where the file can also be opened; gateway support is a follow-up."
  - "Uses three host modules that are not documented plugin API (agent.redact.redact_sensitive_text, hermes_cli.session_export.load_save_snapshot, hermes_cli.session_export.render_session_for_save). hermes plugins validate reports them as private core imports; a host change to any of those signatures needs a matching plugin release."
  - "Requires the GitHub CLI on PATH and signed in with the gist scope. Without it /share still writes a local preview and /share confirm refuses with the command to run."
  - "A gist is secret, not private: unlisted and not searchable, but readable by anyone with the URL."
